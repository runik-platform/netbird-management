name: publish-netbird-management

on:
  push:
    tags:
      - "v*-runik.*"

permissions:
  contents: write
  packages: write

concurrency:
  group: netbird-management-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/runik-platform/netbird-management

jobs:
  publish:
    name: Publish management image and release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tagged snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release contract
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-runik\.(0|[1-9][0-9]*)$ ]]; then
            echo "Unsupported fork release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi

          declared_version="$(sed -n 's/^ARG NETBIRD_VERSION=//p' Containerfile | head -n1)"
          upstream_version="$(sed -n 's/^ARG NETBIRD_UPSTREAM_VERSION=//p' Containerfile | head -n1)"
          if [[ "${version}" != "${declared_version}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match Containerfile ${declared_version}" >&2
            exit 1
          fi
          if [[ ! "${upstream_version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid upstream version: ${upstream_version}" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "upstream_version=${upstream_version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check existing image
        id: image
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and publish image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.release.outputs.version }}
          build-args: |
            NETBIRD_VERSION=${{ steps.release.outputs.version }}
            NETBIRD_UPSTREAM_VERSION=${{ steps.release.outputs.upstream_version }}
            VCS_REF=${{ github.sha }}
          provenance: false
          sbom: false

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "GitHub release already exists: ${RELEASE_TAG}"
            exit 0
          fi
          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --title "${RELEASE_TAG}" \
            --generate-notes \
            --prerelease
